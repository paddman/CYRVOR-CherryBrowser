name: One-time npm lock repair

on:
  push:
    branches: [security-foundation-v1.4]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Regenerate lock metadata without install scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Detect lockfile change
        id: lock
        shell: pwsh
        run: |
          git diff --quiet -- package-lock.json
          $changed = $LASTEXITCODE -ne 0
          if ($changed) {
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Commit repaired lockfile through GitHub API
        if: steps.lock.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/contents/package-lock.json?ref=$env:GITHUB_REF_NAME" --jq .sha
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD 'package-lock.json')))
          $payload = @{
            message = 'Refresh npm lockfile for Electron 44.3.0'
            content = $content
            sha = $sha
            branch = $env:GITHUB_REF_NAME
          } | ConvertTo-Json -Compress
          $payloadPath = Join-Path $env:RUNNER_TEMP 'lock-payload.json'
          [IO.File]::WriteAllText($payloadPath, $payload, (New-Object Text.UTF8Encoding($false)))
          gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/package-lock.json" --input $payloadPath
