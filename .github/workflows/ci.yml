name: Security Foundation CI

on:
  push:
    branches: [main, security-foundation-v1.4]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cherry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, unit, security and source E2E
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Static and security checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Source Electron E2E
        run: npm run test:e2e

  package-windows:
    name: Package and verify hardened Windows app
    runs-on: windows-latest
    timeout-minutes: 35
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build unpacked Windows application
        run: npm run build:dir

      - name: Packaged Electron E2E
        shell: pwsh
        run: |
          $env:CHERRY_EXECUTABLE = (Resolve-Path 'release-browser-identity/win-unpacked/Cherrywebbrowser.exe').Path
          npm run test:e2e

      - name: Upload unpacked smoke-test build
        uses: actions/upload-artifact@v7
        with:
          name: cherry-windows-unpacked-${{ github.sha }}
          path: release-browser-identity/win-unpacked/
          retention-days: 7
          if-no-files-found: error
