name: One-time E2E timing repair

on:
  push:
    branches: [security-foundation-v1.4]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security-foundation-v1.4

      - name: Make navigation wait diagnostic and runner-tolerant
        shell: pwsh
        run: |
          $path = 'tests/browser.spec.js'
          $text = [IO.File]::ReadAllText($path)
          $old = "async function waitURL(url){await expect.poll(async()=>{const s=await state();const t=s.tabs.find(t=>t.id===s.activeId);return t.url===url&&!t.loading&&!t.error;}).toBe(true);}"
          $new = "async function waitURL(url){await expect.poll(async()=>{const s=await state();const t=s.tabs.find(t=>t.id===s.activeId);return t?{url:t.url,loading:t.loading,error:t.error?.description||null}:null;},{timeout:15000,message:`wait for active tab to finish ${url}`}).toEqual({url,loading:false,error:null});}"
          if (-not $text.Contains($old)) { throw 'Expected waitURL helper was not found' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.spec.js
          git commit -m 'Make E2E navigation wait resilient under tab stress'
          git push origin HEAD:security-foundation-v1.4
