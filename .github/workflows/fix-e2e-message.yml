name: One-time E2E syntax repair

on:
  push:
    branches: [security-foundation-v1.4]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security-foundation-v1.4

      - name: Repair waitURL helper without shell interpolation
        shell: pwsh
        run: |
          $path = 'tests/browser.spec.js'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
async function waitURL(url){await expect.poll(async()=>{const s=await state();const t=s.tabs.find(t=>t.id===s.activeId);return t?{url:t.url,loading:t.loading,error:t.error?.description||null}:null;},{timeout:15000,message:wait for active tab to finish }).toEqual({url,loading:false,error:null});}
'@
          $new = @'
async function waitURL(url){await expect.poll(async()=>{const s=await state();const t=s.tabs.find(t=>t.id===s.activeId);return t?{url:t.url,loading:t.loading,error:t.error?.description||null}:null;},{timeout:15000,message:'wait for active tab navigation'}).toEqual({url,loading:false,error:null});}
'@
          if (-not $text.Contains($old.Trim())) { throw 'Malformed waitURL helper was not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Verify syntax
        run: node --check tests/browser.spec.js

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.spec.js
          git commit -m 'Fix E2E navigation diagnostic syntax'
          git push origin HEAD:security-foundation-v1.4
