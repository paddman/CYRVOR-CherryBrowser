name: One-time E2E syntax repair

on:
  push:
    branches: [security-foundation-v1.4]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security-foundation-v1.4

      - name: Repair waitURL helper without shell interpolation
        shell: pwsh
        run: |
          $path = 'tests/browser.spec.js'
          $text = [IO.File]::ReadAllText($path)
          $old = 'message:wait for active tab to finish '
          $new = "message:'wait for active tab navigation'"
          if (-not $text.Contains($old)) { throw 'Malformed waitURL helper was not found' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Verify syntax
        run: node --check tests/browser.spec.js

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.spec.js
          git commit -m 'Fix E2E navigation diagnostic syntax'
          git push origin HEAD:security-foundation-v1.4
